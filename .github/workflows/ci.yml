name: Release preflight

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - run: python -m pytest tests
      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LUNATV_RELEASE_TAG: ${{ github.ref_name }}
        run: python -m pytest -q tests/test_manifest.py::test_manifest_version_and_history_match_release_metadata
      - run: python -m compileall -q plugins.v3/lunatvsource
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: plugins.v3/lunatvsource
      - run: npm run build
        working-directory: plugins.v3/lunatvsource
      - name: Verify generated dist committed
        run: |
          git diff --check
          git diff --exit-code -- plugins.v3/lunatvsource/dist
          test -z "$(git ls-files --others --exclude-standard -- plugins.v3/lunatvsource/dist)"
      - name: Build and verify release package
        run: |
          set -eu
          version="$(python -c 'import json; print(json.load(open("package.v3.json"))["LunaTVSource"]["version"])')"
          zip_path="$RUNNER_TEMP/lunatvsource_v${version}.zip"
          checksum_path="${zip_path}.sha256"
          rm -f "$zip_path" "$checksum_path"
          (
            cd plugins.v3/lunatvsource
            zip -qr "$zip_path" . \
              -x 'node_modules/*' '*/node_modules/*' \
               '.git/*' '*/.git/*' \
               '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.pyo' \
               '.pytest_cache/*' '*/.pytest_cache/*' \
               '.mypy_cache/*' '*/.mypy_cache/*' \
               '.ruff_cache/*' '*/.ruff_cache/*' \
               '.DS_Store' '*/.DS_Store'
          )
          entries="$(zipinfo -1 "$zip_path")"
          test -z "$(printf '%s\n' "$entries" | awk -F/ '$1 == "lunatvsource" { print; exit }')"
          for required in __init__.py downloader.py m3u8_engine.py package.json dist/assets/remoteEntry.js; do
            printf '%s\n' "$entries" | grep -Fxq "$required"
          done
          ! printf '%s\n' "$entries" | grep -Eq '(^|/)(node_modules|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)(/|$)'
          (
            cd "$(dirname "$zip_path")"
            sha256sum "$(basename "$zip_path")" > "$(basename "$checksum_path")"
            sha256sum -c "$(basename "$checksum_path")"
          )
          printf 'RELEASE_ZIP=%s\nRELEASE_CHECKSUM=%s\n' "$zip_path" "$checksum_path" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: lunatvsource-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CHECKSUM }}

  release:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/LunaTVSource_v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: lunatvsource-release
          path: release-assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(python -c 'import json; print(json.load(open("package.v3.json"))["LunaTVSource"]["version"])')"
          expected_tag="LunaTVSource_v${version}"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "release-assets/lunatvsource_v${version}.zip" \
              "release-assets/lunatvsource_v${version}.zip.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "release-assets/lunatvsource_v${version}.zip" \
              "release-assets/lunatvsource_v${version}.zip.sha256" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
