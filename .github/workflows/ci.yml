name: Release preflight

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - run: python -m pytest tests
      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LUNATV_RELEASE_TAG: ${{ github.ref_name }}
        run: python -m pytest -q tests/test_manifest.py::test_manifest_version_and_history_match_release_metadata
      - name: Verify release tag commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: python -m compileall -q plugins.v3/lunatvsource
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci
        working-directory: plugins.v3/lunatvsource
      - run: npm run build
        working-directory: plugins.v3/lunatvsource
      - name: Verify generated dist committed
        run: |
          git diff --check
          git diff --exit-code -- plugins.v3/lunatvsource/dist
          test -z "$(git ls-files --others --exclude-standard -- plugins.v3/lunatvsource/dist)"
      - name: Build and verify release package
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("package.v3.json"))["LunaTVSource"]["version"])')"
          zip_path="$RUNNER_TEMP/lunatvsource_v${version}.zip"
          checksum_path="${zip_path}.sha256"
          entries_path="$RUNNER_TEMP/lunatvsource_zip_entries.txt"
          vendor_dir="$RUNNER_TEMP/lunatvsource_vendor"
          rm -f "$zip_path" "$checksum_path" "$entries_path"
          rm -rf "$vendor_dir"
          (
            cd plugins.v3/lunatvsource
            zip -qr "$zip_path" . \
              -x 'node_modules/*' '*/node_modules/*' \
              '.git/*' '*/.git/*' \
              '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.pyo' \
              '.pytest_cache/*' '*/.pytest_cache/*' \
              '.mypy_cache/*' '*/.mypy_cache/*' \
              '.ruff_cache/*' '*/.ruff_cache/*' \
              '.DS_Store' '*/.DS_Store'
          )
          (
            cd "$(dirname "$zip_path")"
            sha256sum "$(basename "$zip_path")" > "$(basename "$checksum_path")"
            sha256sum -c "$(basename "$checksum_path")"
          )
          unzip -t "$zip_path"
          unzip -Z1 "$zip_path" > "$entries_path"
          if grep -q '^lunatvsource/' "$entries_path"; then
            echo "Release ZIP must contain plugin files at the archive root" >&2
            exit 1
          fi
          required_files=(
            __init__.py
            ai.py
            cms.py
            downloader.py
            m3u8_engine.py
            naming.py
            package.json
            fallback_sources.json
            dist/index.html
            dist/assets/remoteEntry.js
            vendor/n_m3u8dl_re/LICENSE
            vendor/n_m3u8dl_re/README.md
            vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-x64_20251029.tar.gz
            vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-arm64_20251029.tar.gz
          )
          for required_file in "${required_files[@]}"; do
            grep -Fxq "$required_file" "$entries_path"
          done
          if grep -Eq '(^|/)(node_modules|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)(/|$)|(^|/)\.DS_Store$|\.py[co]$' "$entries_path"; then
            echo "Release ZIP contains excluded files" >&2
            exit 1
          fi
          mkdir -p "$vendor_dir"
          unzip -q "$zip_path" 'vendor/n_m3u8dl_re/*.tar.gz' -d "$vendor_dir"
          (
            cd "$vendor_dir"
            printf '%s\n' \
              '2acce91b64af3ee676a32d1002e1382840d81f430e1b7f8d5b151ce1eb6fb590  vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-x64_20251029.tar.gz' \
              'b9cce9978e94fd8ce509ee86a6543cccffeb0ee5b7b7aeff1314104265ac65ad  vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-arm64_20251029.tar.gz' \
              | sha256sum -c -
          )
          test "$(tar -tzf "$vendor_dir/vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-x64_20251029.tar.gz")" = "N_m3u8DL-RE"
          test "$(tar -tzf "$vendor_dir/vendor/n_m3u8dl_re/N_m3u8DL-RE_v0.5.1-beta_linux-arm64_20251029.tar.gz")" = "N_m3u8DL-RE"
          printf 'RELEASE_ZIP=%s\nRELEASE_CHECKSUM=%s\n' "$zip_path" "$checksum_path" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lunatvsource-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CHECKSUM }}

  release:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/LunaTVSource_v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lunatvsource-release
          path: release-assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("package.v3.json"))["LunaTVSource"]["version"])')"
          expected_tag="LunaTVSource_v${version}"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          (
            cd release-assets
            sha256sum -c "lunatvsource_v${version}.zip.sha256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/lunatvsource_v${version}.zip" \
            "release-assets/lunatvsource_v${version}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
